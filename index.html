<!DOCTYPE html>
<html lang="cs"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="apple-mobile-web-app-capable" content="yes"><title>PREHISTORIK LIERO</title>
<style>*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0}html,body{height:100%;height:100dvh;background:#07060c;color:#f4e6c0;font-family:ui-monospace,sans-serif;overflow:hidden;touch-action:none;user-select:none}#wrap{position:relative;margin:0 auto;line-height:0}canvas{display:block;width:100%;height:100%;image-rendering:pixelated}#pad{position:absolute;inset:0;pointer-events:none}#pad button{pointer-events:auto;position:absolute;border:3px solid rgba(240,192,64,.75);background:rgba(10,8,20,.7);color:#f0c040;font:12px ui-monospace,sans-serif;display:flex;align-items:center;justify-content:center;touch-action:none}.rnd{border-radius:50%;width:78px;height:78px}#btnL{left:max(8px,env(safe-area-inset-left));bottom:max(12px,env(safe-area-inset-bottom))}#btnR{left:calc(max(8px,env(safe-area-inset-left)) + 86px);bottom:max(12px,env(safe-area-inset-bottom))}#btnJ{right:calc(max(8px,env(safe-area-inset-right)) + 86px);bottom:max(12px,env(safe-area-inset-bottom))}#btnF{right:max(8px,env(safe-area-inset-right));bottom:max(12px,env(safe-area-inset-bottom));width:92px;height:92px}#btnU{right:calc(max(8px,env(safe-area-inset-right)) + 86px);bottom:calc(98px + env(safe-area-inset-bottom));width:64px;height:64px}#btnD{right:max(8px,env(safe-area-inset-right));bottom:calc(110px + env(safe-area-inset-bottom));width:64px;height:64px}#btnW{left:50%;transform:translateX(-50%);bottom:max(16px,env(safe-area-inset-bottom));width:120px;height:48px;border-radius:16px}</style></head>
<body><div id="wrap"><canvas id="c" width="640" height="360"></canvas><div id="pad">
<button class="rnd" id="btnL" type="button"><</button>
<button class="rnd" id="btnR" type="button">></button>
<button class="rnd" id="btnU" type="button">AIM+</button>
<button class="rnd" id="btnD" type="button">AIM-</button>
<button class="rnd" id="btnJ" type="button">SKOK</button>
<button class="rnd" id="btnF" type="button">PAL</button>
<button id="btnW" type="button">ZBRAN</button>
</div></div>
<script src="a.js"></script></body></html>
